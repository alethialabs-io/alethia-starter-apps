apiVersion: v1
kind: Service
metadata:
  name: hello
  labels:
    app.kubernetes.io/name: hello
    app.kubernetes.io/part-of: alethia-starter-apps
spec:
  # ClusterIP, deliberately. A LoadBalancer here would provision a cloud load balancer — and bill
  # for it — the moment someone points an environment at this template to see what it does.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hello
  ports:
    - name: http
      port: 80
      targetPort: http
